name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (must already exist, e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  # Resolve the tag once so every downstream job builds the same ref, and refuse
  # anything that is not a v-prefixed semver.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RAW_TAG}"
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${tag}' is not a v-prefixed semver (expected e.g. v0.1.0)." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            asset: astrograph-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            asset: astrograph-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: astrograph-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: astrograph-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # workflow_dispatch checks out the default branch unless told otherwise,
      # which would publish main's code under an older tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # package.json versions are pinned at 0.1.0 in-tree; help.ts reads
      # pkg.version, so without this `astrograph --version` would lie forever.
      - name: Stamp version from tag
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for f in package.json packages/*/package.json apps/*/package.json; do
            [ -f "$f" ] || continue
            PKG_FILE="$f" bun -e '
              const file = process.env.PKG_FILE;
              const pkg = await Bun.file(file).json();
              pkg.version = process.env.RELEASE_VERSION;
              await Bun.write(file, `${JSON.stringify(pkg, null, "\t")}\n`);
            '
          done
          grep -H '"version"' package.json packages/cli/package.json

      - name: Compile binary
        run: |
          bun build packages/cli/src/bin/astrograph.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.asset }}

      # Every matrix runner is native for its target, so each binary can run
      # here. This also proves the version stamp landed.
      - name: Smoke test binary
        run: |
          set -euo pipefail
          chmod +x dist/${{ matrix.asset }}
          out="$(dist/${{ matrix.asset }} --version)"
          echo "$out"
          test "$out" = "astrograph ${{ needs.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name 'astrograph-*' -exec cp {} release/ \;
          cd release
          # upload-artifact does not preserve the executable bit. GitHub release
          # assets carry no mode either, so manual downloads still need
          # `chmod +x` (documented in docs/install.md); the installer script
          # uses `install -m 755`.
          chmod 755 astrograph-*
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum astrograph-* > SHA256SUMS
          else
            shasum -a 256 astrograph-* > SHA256SUMS
          fi
          ls -la
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            release/astrograph-darwin-arm64
            release/astrograph-darwin-x64
            release/astrograph-linux-x64
            release/astrograph-linux-arm64
            release/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
