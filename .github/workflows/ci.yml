name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format check
        run: bun run check

      - name: Test
        run: bun test

      # Guards the release path: catches a broken compile before a tag is cut.
      - name: Compile binary
        run: bun run build

      - name: Smoke test binary
        run: |
          set -euo pipefail
          chmod +x dist/astrograph
          dist/astrograph --version
          dist/astrograph --help > /dev/null

      # The installer is piped into `sh`, so it must parse under dash.
      - name: Shellcheck installer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash shellcheck
          dash -n apps/site/public/install.sh
          shellcheck --shell=sh apps/site/public/install.sh
